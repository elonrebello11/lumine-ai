<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumine AI — Advanced Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            950: '#090d16',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @keyframes floatUp {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-float { animation: floatUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Custom sleek scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.4); }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col justify-between overflow-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Top Floating Branding Badge -->
    <div class="absolute top-3 right-4 z-30 hidden sm:flex items-center space-x-2 text-[11px] font-semibold text-indigo-300 bg-indigo-950/60 px-3.5 py-1.5 rounded-full border border-indigo-800/50 shadow-xl backdrop-blur-md">
        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
        <span>Powered by Hydrogen Gemini</span>
    </div>

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800/80 glass-panel px-4 sm:px-8 py-3.5 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-3.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center font-bold text-base text-white shadow-lg shadow-indigo-500/25">
                L
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight text-white flex items-center gap-2">
                    Lumine <span class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-medium">v2.0</span>
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">Neutral, fast, and responsive assistant</p>
            </div>
        </div>

        <div id="auth-section" class="flex items-center space-x-3">
            <button id="login-btn" onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-lg shadow-indigo-600/25 flex items-center gap-2 active:scale-95">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12.24 10.285V14.2h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0 5.48 0 0 5.48 0 12.24s5.48 12.24 12.24 12.24c7.058 0 11.732-4.96 11.732-11.951 0-.825-.088-1.452-.196-2.044H12.24z"/></svg>
                Sign in with Google
            </button>
            <div id="user-info" class="hidden items-center space-x-3 bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-xl shadow-inner">
                <span id="user-name" class="text-xs sm:text-sm font-medium text-slate-300 max-w-[120px] sm:max-w-[180px] truncate"></span>
                <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/30 border border-slate-700 px-2.5 py-1 rounded-lg text-slate-400 transition-all">Sign out</button>
            </div>
        </div>
    </header>

    <!-- Main Chat Window Area -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 max-w-4xl w-full mx-auto" id="chat-container">
        <!-- Welcome Greeting Card -->
        <div class="flex items-start space-x-3.5 animate-float">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-sm text-white shadow-md shrink-0">L</div>
            <div class="space-y-3 max-w-[90%] sm:max-w-[80%]">
                <div class="glass-panel border border-slate-800/80 rounded-2xl p-4 sm:p-5 text-sm text-slate-200 shadow-xl leading-relaxed">
                    <p class="font-semibold text-white mb-1">Hello, I am Lumine.</p>
                    <p class="text-slate-300">How can I assist your workflow today? Choose a prompt below or type your query directly.</p>
                </div>
                <!-- Quick Suggestion Chips -->
                <div class="flex flex-wrap gap-2 pt-1">
                    <button onclick="sendPreset('Explain quantum computing simply')" class="text-xs bg-slate-900 hover:bg-indigo-600/20 hover:border-indigo-500/40 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-lg transition-all shadow-sm">⚡ Explain quantum computing</button>
                    <button onclick="sendPreset('Write a python script for file batch renaming')" class="text-xs bg-slate-900 hover:bg-indigo-600/20 hover:border-indigo-500/40 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-lg transition-all shadow-sm">💻 Python batch rename script</button>
                    <button onclick="sendPreset('Give me 3 healthy meal prep ideas')" class="text-xs bg-slate-900 hover:bg-indigo-600/20 hover:border-indigo-500/40 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-lg transition-all shadow-sm">🥗 Healthy meal prep ideas</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Input & Footer Control Bar -->
    <footer class="border-t border-slate-800/80 glass-panel p-4 sm:p-6 z-20 shrink-0">
        <form id="chat-form" onsubmit="handleSubmit(event)" class="max-w-4xl mx-auto flex gap-3 items-center">
            <div class="relative flex-1">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Ask Lumine anything..." 
                    autocomplete="off"
                    class="w-full bg-slate-900/90 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-2xl px-4.5 py-3.5 text-sm sm:text-base text-slate-100 placeholder-slate-500 outline-none transition-all shadow-inner"
                >
            </div>
            <button 
                type="submit" 
                id="send-btn"
                class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-6 py-3.5 rounded-2xl text-sm font-semibold transition-all shadow-lg shadow-indigo-600/30 shrink-0 flex items-center justify-center gap-2"
            >
                <span>Send</span>
                <svg class="w-4 h-4 rotate-90" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </form>

        <!-- Fixed Branding Footer -->
        <div class="text-center mt-3 pt-2 border-t border-slate-900 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-6 text-[11px] text-slate-500 font-medium">
            <span class="uppercase tracking-wider">Made by killer studious</span>
            <span class="hidden sm:inline text-slate-700">•</span>
            <span class="sm:hidden text-indigo-400 font-semibold">Powered by Hydrogen Gemini</span>
        </div>
    </footer>

    <!-- Firebase & Chat Logic Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Firebase Web Config placeholders (Update with your Firebase Console values if desired)
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let idToken = null;

        window.loginWithGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login popup error:", error);
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            const loginBtn = document.getElementById('login-btn');
            const userInfo = document.getElementById('user-info');
            const userName = document.getElementById('user-name');

            if (user) {
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('flex');
                userInfo.style.display = 'flex';
                userName.textContent = user.displayName || user.email;
                idToken = await user.getIdToken();
            } else {
                loginBtn.classList.remove('hidden');
                userInfo.style.display = 'none';
                idToken = null;
            }
        });

        window.sendPreset = (text) => {
            document.getElementById('user-input').value = text;
            document.getElementById('chat-form').dispatchEvent(new Event('submit'));
        };

        window.handleSubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const prompt = input.value.trim();
            if (!prompt) return;

            const container = document.getElementById('chat-container');
            
            // Append User Bubble
            container.innerHTML += `
                <div class="flex items-end justify-end space-x-3 animate-float">
                    <div class="bg-indigo-600 text-white rounded-2xl px-4.5 py-3 text-sm sm:text-base max-w-[85%] shadow-md leading-relaxed">${escapeHtml(prompt)}</div>
                </div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Loading State Bubble
            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `
                <div id="${loadingId}" class="flex items-start space-x-3.5 animate-float">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-sm text-white shadow-md shrink-0">L</div>
                    <div class="glass-panel border border-slate-800 rounded-2xl px-4 py-3.5 text-sm text-slate-400 shadow-lg flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-bounce"></span>
                        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-bounce [animation-delay:0.2s]"></span>
                        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-bounce [animation-delay:0.4s]"></span>
                        <span class="ml-1 text-xs text-slate-400">Lumine is thinking...</span>
                    </div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (idToken) headers['Authorization'] = `Bearer ${idToken}`;

                const res = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();

                document.getElementById(loadingId).remove();
                
                container.innerHTML += `
                    <div class="flex items-start space-x-3.5 animate-float">
                        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-sm text-white shadow-md shrink-0">L</div>
                        <div class="glass-panel border border-slate-800 rounded-2xl px-4.5 py-3.5 text-sm sm:text-base text-slate-200 shadow-xl max-w-[90%] sm:max-w-[85%] leading-relaxed">${escapeHtml(data.reply || data.error)}</div>
                    </div>`;
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `
                    <div class="flex items-start space-x-3.5 animate-float">
                        <div class="w-9 h-9 rounded-xl bg-red-600 flex items-center justify-center font-bold text-sm text-white shadow-md shrink-0">!</div>
                        <div class="bg-slate-900 border border-red-900/50 rounded-2xl px-4.5 py-3.5 text-sm text-red-400 shadow-xl max-w-[85%]">Connection error occurred. Please check network/Netlify function.</div>
                    </div>`;
                container.scrollTop = container.scrollHeight;
            }
        };

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
