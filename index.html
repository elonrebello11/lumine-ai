<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumine AI — Advanced Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @keyframes floatUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-float { animation: floatUp 0.3s ease-out forwards; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 9999px; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col justify-between overflow-hidden">

    <!-- Top Branding -->
    <div class="absolute top-3 right-4 z-30 hidden sm:flex items-center space-x-2 text-[11px] font-semibold text-indigo-300 bg-indigo-950/70 px-3.5 py-1.5 rounded-full border border-indigo-800/50 shadow-xl backdrop-blur-md">
        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
        <span>Powered by Hydrogen Gemini</span>
    </div>

    <!-- Header -->
    <header class="border-b border-slate-800 glass-panel px-4 sm:px-6 py-3.5 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-base text-white shadow-lg">L</div>
            <h1 class="font-bold text-base tracking-tight text-white">Lumine</h1>
        </div>
        <div id="auth-section" class="flex items-center space-x-3">
            <button id="login-btn" onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-lg shadow-indigo-600/25">
                Sign in with Google
            </button>
            <div id="user-info" class="hidden items-center space-x-3 bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-xl">
                <span id="user-name" class="text-xs sm:text-sm font-medium text-slate-300 max-w-[140px] truncate"></span>
                <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-lg text-slate-300 transition-all">Sign out</button>
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 max-w-4xl w-full mx-auto" id="chat-container">
        <div class="flex items-start space-x-3 animate-float">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-sm text-white shrink-0">L</div>
            <div class="glass-panel border border-slate-800 rounded-2xl p-4 text-sm sm:text-base text-slate-200 shadow-lg max-w-[85%] leading-relaxed">
                Hello. I am Lumine. How can I help you today?
            </div>
        </div>
    </main>

    <!-- Input Area & Footer -->
    <footer class="border-t border-slate-800 glass-panel p-4 sm:p-6 z-20 shrink-0">
        <form id="chat-form" onsubmit="handleSubmit(event)" class="max-w-4xl mx-auto flex gap-3">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Ask Lumine anything..." 
                autocomplete="off"
                class="flex-1 bg-slate-900 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm sm:text-base text-slate-100 placeholder-slate-500 outline-none transition-all"
            >
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl text-sm font-semibold transition-all shadow-lg shrink-0">
                Send
            </button>
        </form>
        <div class="text-center mt-3">
            <span class="text-[11px] text-slate-500 font-medium uppercase tracking-wider">Made by killer studious</span>
        </div>
    </footer>

    <!-- Firebase SDK Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBB0rtme8j8C7ykkdbf0MoQkx_hmkoMyIc",
            authDomain: "lumine-ai-dde1b.firebaseapp.com",
            projectId: "lumine-ai-dde1b",
            storageBucket: "lumine-ai-dde1b.firebasestorage.app",
            messagingSenderId: "33838856101",
            appId: "1:33838856101:web:49bc34befba81df7b71a4c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        let idToken = null;

        window.loginWithGoogle = async () => {
            try { await signInWithPopup(auth, provider); } catch (e) { console.error(e); }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            const loginBtn = document.getElementById('login-btn');
            const userInfo = document.getElementById('user-info');
            const userName = document.getElementById('user-name');
            if (user) {
                loginBtn.classList.add('hidden');
                userInfo.style.display = 'flex';
                userName.textContent = user.displayName || user.email;
                idToken = await user.getIdToken();
            } else {
                loginBtn.classList.remove('hidden');
                userInfo.style.display = 'none';
                idToken = null;
            }
        });

        window.handleSubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const prompt = input.value.trim();
            if (!prompt) return;

            const container = document.getElementById('chat-container');
            container.innerHTML += `<div class="flex items-end justify-end space-x-3 animate-float"><div class="bg-indigo-600 text-white rounded-2xl px-4 py-3 text-sm sm:text-base max-w-[85%]">${escapeHtml(prompt)}</div></div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div id="${loadingId}" class="flex items-start space-x-3 animate-float"><div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-sm text-white shrink-0">L</div><div class="glass-panel border border-slate-800 rounded-2xl px-4 py-3 text-sm text-slate-400">Thinking...</div></div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (idToken) headers['Authorization'] = `Bearer ${idToken}`;

                const res = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();

                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="flex items-start space-x-3 animate-float"><div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-sm text-white shrink-0">L</div><div class="glass-panel border border-slate-800 rounded-2xl px-4 py-3 text-sm sm:text-base text-slate-200 max-w-[85%]">${escapeHtml(data.reply || data.error)}</div></div>`;
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="flex items-start space-x-3 animate-float"><div class="w-9 h-9 rounded-xl bg-red-600 flex items-center justify-center font-bold text-sm text-white shrink-0">!</div><div class="glass-panel border border-red-900/50 rounded-2xl px-4 py-3 text-sm text-red-400 max-w-[85%]">Connection error.</div></div>`;
            }
        };

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
