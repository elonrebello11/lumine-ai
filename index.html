<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumine AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .glass {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(148, 163, 184, 0.18);
      }
      @keyframes floatUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-float {
        animation: floatUp 0.25s ease-out forwards;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 overflow-hidden">
    <div class="absolute right-4 top-4 z-30 hidden items-center gap-2 rounded-full border border-indigo-500/30 bg-indigo-950/70 px-3 py-1.5 text-[11px] font-semibold text-indigo-200 sm:flex">
      <span class="h-2 w-2 animate-pulse rounded-full bg-indigo-400"></span>
      <span>Powered by Hydrogen Gemini</span>
    </div>

    <div class="flex min-h-screen flex-col">
      <header class="glass sticky top-0 z-20 border-b border-slate-800/80 px-4 py-3 sm:px-6">
        <div class="mx-auto flex max-w-5xl items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 font-bold text-white shadow-lg shadow-indigo-500/20">
              L
            </div>
            <div>
              <h1 class="text-lg font-semibold tracking-tight text-white">Lumine</h1>
            </div>
          </div>

          <div id="auth-section" class="flex items-center gap-3">
            <button
              id="login-btn"
              type="button"
              class="rounded-xl bg-indigo-600 px-4 py-2 text-xs font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:bg-indigo-500 sm:text-sm"
            >
              Sign in with Google
            </button>

            <div
              id="user-info"
              class="hidden items-center gap-3 rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-1.5"
            >
              <span id="user-name" class="max-w-[140px] truncate text-xs text-slate-300 sm:text-sm"></span>
              <button
                id="logout-btn"
                type="button"
                class="rounded-lg bg-slate-800 px-2.5 py-1 text-[11px] text-slate-300 transition hover:bg-slate-700"
              >
                Sign out
              </button>
            </div>
          </div>
        </div>
      </header>

      <main id="chat-container" class="mx-auto flex w-full max-w-4xl flex-1 flex-col gap-4 overflow-y-auto px-4 py-5 sm:px-6 sm:py-6">
        <div class="animate-float flex items-start gap-3">
          <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-indigo-600 font-bold text-sm text-white">
            L
          </div>
          <div class="glass max-w-[85%] rounded-2xl p-4 text-sm leading-relaxed text-slate-200 sm:text-base">
            Hello. I am Lumine. How can I help you today?
          </div>
        </div>
      </main>

      <footer class="border-t border-slate-800/80 bg-slate-950/60 px-4 py-4 sm:px-6">
        <form id="chat-form" class="mx-auto flex max-w-4xl gap-3">
          <input
            id="user-input"
            type="text"
            autocomplete="off"
            placeholder="Ask Lumine anything..."
            class="flex-1 rounded-xl border border-slate-700 bg-slate-900/80 px-4 py-3 text-sm text-slate-100 placeholder-slate-400 outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 sm:text-base"
          />
          <button
            type="submit"
            class="shrink-0 rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:bg-indigo-500"
          >
            Send
          </button>
        </form>

        <div class="mt-3 text-center">
          <span class="text-[11px] font-medium uppercase tracking-[0.2em] text-slate-500">
            Made by killer studious
          </span>
        </div>
      </footer>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();
      let idToken = null;

      const loginBtn = document.getElementById("login-btn");
      const userInfo = document.getElementById("user-info");
      const userName = document.getElementById("user-name");
      const chatContainer = document.getElementById("chat-container");
      const userInput = document.getElementById("user-input");
      const chatForm = document.getElementById("chat-form");

      function addMessage(text, side = "left") {
        const wrapper = document.createElement("div");
        wrapper.className = `animate-float flex items-start gap-3 ${side === "right" ? "justify-end" : ""}`;
        const bubble = document.createElement("div");
        bubble.className =
          side === "right"
            ? "rounded-2xl bg-indigo-600 px-4 py-3 text-sm text-white shadow-lg shadow-indigo-500/20 sm:text-base max-w-[85%]"
            : "glass rounded-2xl p-4 text-sm text-slate-200 sm:text-base max-w-[85%] leading-relaxed";
        bubble.textContent = text;
        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function setLoginState(user) {
        if (user) {
          loginBtn.classList.add("hidden");
          userInfo.classList.remove("hidden");
          userName.textContent = user.displayName || user.email || "User";
          idToken = user.getIdToken ? user.getIdToken() : null;
        } else {
          loginBtn.classList.remove("hidden");
          userInfo.classList.add("hidden");
          userName.textContent = "";
          idToken = null;
        }
      }

      async function refreshToken() {
        if (!auth.currentUser) return null;
        idToken = await auth.currentUser.getIdToken();
        return idToken;
      }

      loginBtn.addEventListener("click", async () => {
        try {
          await signInWithPopup(auth, provider);
        } catch (error) {
          console.error("Google sign-in failed:", error);
        }
      });

      document.getElementById("logout-btn").addEventListener("click", async () => {
        try {
          await signOut(auth);
        } catch (error) {
          console.error("Sign-out failed:", error);
        }
      });

      onAuthStateChanged(auth, async (user) => {
        setLoginState(user);
        if (user) {
          await refreshToken();
        }
      });

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const prompt = userInput.value.trim();
        if (!prompt) return;

        addMessage(prompt, "right");
        userInput.value = "";

        const loading = document.createElement("div");
        loading.className = "animate-float flex items-start gap-3";
        loading.innerHTML = `
          <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-indigo-600 font-bold text-sm text-white">
            L
          </div>
          <div class="glass rounded-2xl p-4 text-sm text-slate-200 sm:text-base">
            Thinking...
          </div>
        `;
        chatContainer.appendChild(loading);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
          const token = await refreshToken();
          const headers = {
            "Content-Type": "application/json"
          };

          if (token) {
            headers.Authorization = `Bearer ${token}`;
          }

          const res = await fetch("/.netlify/functions/chat", {
            method: "POST",
            headers,
            body: JSON.stringify({ prompt })
          });

          const data = await res.json();

          loading.remove();

          if (!res.ok) {
            addMessage(data?.error || "Something went wrong.", "left");
            return;
          }

          addMessage(data.reply || "No response generated.", "left");
        } catch (error) {
          loading.remove();
          addMessage("Sorry, I hit an error while contacting Lumine.", "left");
          console.error(error);
        }
      });
    </script>
  </body>
</html>
