<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070914" />
    <title>Lumine AI</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #070914;
        --bg-1: #090d1b;
        --bg-2: #0d1222;
        --panel: rgba(15, 22, 37, 0.7);
        --panel-strong: rgba(16, 24, 41, 0.94);
        --line: rgba(180, 191, 255, 0.15);
        --line-bright: rgba(180, 191, 255, 0.28);
        --text: #edf0ff;
        --muted: #a8afcb;
        --soft: #7d84a1;
        --primary: #8a7cff;
        --primary-strong: #6f5fe8;
        --cyan: #68d5f5;
        --success: #72e5b9;
        --danger: #ff8398;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      html {
        min-height: 100%;
        background: var(--page);
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at 12% 12%, rgba(112, 96, 255, 0.18), transparent 25%),
          radial-gradient(circle at 88% 84%, rgba(75, 202, 255, 0.12), transparent 20%),
          linear-gradient(135deg, #070b16 0%, #09101d 45%, #0a101d 100%);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body, button, input, textarea { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid rgba(138, 124, 255, 0.8);
        outline-offset: 2px;
      }
      ::selection { background: rgba(138, 124, 255, 0.35); color: #fff; }

      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        isolation: isolate;
      }

      .ambient {
        position: absolute;
        width: 460px;
        height: 460px;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.14;
        pointer-events: none;
        z-index: 0;
      }

      .ambient.one {
        left: -180px;
        top: 8%;
        background: #7c6cff;
      }

      .ambient.two {
        right: -180px;
        bottom: 8%;
        background: #56d4f8;
      }

      .glass {
        border: 1px solid var(--line);
        background: rgba(14, 20, 31, 0.72);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .topbar {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 80px;
        padding: 14px clamp(16px, 4vw, 40px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        background: rgba(8, 11, 19, 0.66);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--text);
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 16px;
        background: linear-gradient(145deg, #9a8dff, #665ae7 70%);
        box-shadow: 0 10px 28px rgba(124, 108, 255, 0.35);
        border: 1px solid rgba(222, 216, 255, 0.35);
        font-weight: 800;
        font-size: 20px;
        color: white;
      }

      .brand-copy {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }

      .brand-name {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .brand-sub {
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--soft);
      }

      .header-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(132, 122, 255, 0.28);
        background: rgba(83, 69, 157, 0.18);
        color: #dfe1ff;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .status-pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 10px rgba(114, 229, 185, 0.8);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 13px;
        background: transparent;
        color: currentColor;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      }

      .button:hover:not(:disabled) { transform: translateY(-1px); }
      .button:active:not(:disabled) { transform: translateY(0) scale(0.98); }
      .button:disabled { opacity: 0.6; cursor: not-allowed; }

      .button-primary {
        background: linear-gradient(135deg, #8f82ff, #685ce6);
        box-shadow: 0 10px 24px rgba(101, 88, 220, 0.24);
        color: white;
      }

      .button-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #9b90ff, #7268eb);
      }

      .button-ghost {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: #edf4ff;
      }

      .button-ghost:hover:not(:disabled) {
        border-color: var(--line-bright);
        background: rgba(255, 255, 255, 0.08);
      }

      .icon { width: 18px; height: 18px; }

      .auth-controls { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }

      .user-chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 5px 7px 5px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.035);
        max-width: 240px;
      }

      .user-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.08);
      }

      .user-name {
        overflow: hidden;
        max-width: 120px;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 12px;
        color: #eff3ff;
      }

      .signout-btn {
        min-height: 30px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 11px;
      }

      .chat-shell {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        width: min(100%, 920px);
        min-height: 0;
        flex: 1;
        align-self: center;
        padding: 0 clamp(14px, 3vw, 32px);
      }

      .chat-scroll {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-height: 0;
        flex: 1;
        overflow-y: auto;
        padding: 28px 2px 32px;
        scrollbar-width: thin;
        scrollbar-color: rgba(138, 124, 255, 0.38) transparent;
      }

      .chat-scroll::-webkit-scrollbar { width: 6px; }
      .chat-scroll::-webkit-scrollbar-track { background: transparent; }
      .chat-scroll::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(138, 124, 255, 0.38);
      }

      .welcome {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        align-self: center;
        margin: auto 0;
        padding: 24px 12px 32px;
        max-width: 650px;
      }

      .welcome-orb {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(146, 132, 255, 0.96), rgba(82, 86, 171, 0.96));
        border: 1px solid rgba(204, 195, 255, 0.42);
        box-shadow: 0 12px 34px rgba(107, 96, 224, 0.34);
        color: white;
        font-size: 34px;
        font-weight: 700;
        margin-bottom: 18px;
      }

      .welcome h2 {
        margin: 0;
        font-size: clamp(32px, 4.5vw, 52px);
        line-height: 1.05;
        letter-spacing: -0.06em;
        font-weight: 700;
      }

      .gradient-text {
        background: linear-gradient(135deg, #d2ceff 0%, #8eddf6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .welcome p {
        margin: 12px 0 0;
        max-width: 470px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.75;
      }

      .suggestions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 22px;
      }

      .suggestion {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
        color: #dfe5ff;
        font-size: 11px;
        cursor: pointer;
        transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
      }

      .suggestion:hover {
        border-color: var(--line-bright);
        background: rgba(138, 124, 255, 0.1);
        transform: translateY(-1px);
      }

      .message {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        width: 100%;
        animation: appear 0.25s ease both;
      }

      .message-user { justify-content: flex-end; }

      .message-avatar {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border-radius: 12px;
        background: linear-gradient(145deg, #8a7cff, #5d53d8);
        border: 1px solid rgba(214, 208, 255, 0.22);
        font-weight: 700;
        color: white;
        font-size: 14px;
      }

      .message-avatar.user {
        background: linear-gradient(145deg, #43a8d6, #2c6f8a);
        border-color: rgba(122, 211, 249, 0.24);
      }

      .message-content {
        display: flex;
        flex-direction: column;
        max-width: min(80%, 700px);
        gap: 6px;
      }

      .message-user .message-content { align-items: flex-end; }

      .message-bubble {
        overflow-wrap: anywhere;
        padding: 13px 16px;
        border-radius: 18px 18px 18px 6px;
        border: 1px solid var(--line);
        background: rgba(18, 25, 39, 0.8);
        color: #edf0ff;
        box-shadow: 0 9px 24px rgba(0, 0, 0, 0.08);
        line-height: 1.72;
      }

      .message-user .message-bubble {
        border-radius: 18px 18px 6px 18px;
        background: linear-gradient(140deg, rgba(111, 94, 228, 0.95), rgba(82, 72, 180, 0.92));
        border-color: rgba(150, 143, 255, 0.22);
      }

      .message-error .message-bubble {
        border: 1px solid rgba(255, 129, 148, 0.22);
        background: rgba(81, 25, 37, 0.4);
        color: #ffd8df;
      }

      .message-bubble p { margin: 0 0 10px; }
      .message-bubble p:last-child { margin-bottom: 0; }

      .message-bubble pre,
      .message-bubble code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .message-bubble pre {
        margin: 12px 0;
        padding: 12px 13px;
        border-radius: 10px;
        background: rgba(5, 9, 18, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.07);
      }

      .typing {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .typing-dot {
        width: 7px;
        height: 7px;
        display: inline-block;
        border-radius: 50%;
        background: rgba(170, 161, 255, 0.9);
        animation: bounce 1s infinite ease-in-out;
      }

      .typing-dot:nth-child(2) { animation-delay: 0.15s; }
      .typing-dot:nth-child(3) { animation-delay: 0.25s; }

      .composer-wrap {
        position: relative;
        z-index: 2;
        padding: 10px clamp(14px, 3vw, 32px) 14px;
        background: linear-gradient(180deg, rgba(7, 11, 22, 0), rgba(8, 11, 20, 0.8) 16%);
      }

      .composer {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        width: min(100%, 885px);
        margin: 0 auto;
        padding: 10px;
        border-radius: 18px;
        background: rgba(18, 22, 35, 0.9);
        border: 1px solid rgba(171, 183, 255, 0.18);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .composer:focus-within {
        border-color: rgba(138, 124, 255, 0.5);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.2), 0 0 0 3px rgba(138, 124, 255, 0.08);
      }

      .prompt-input {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        max-height: 170px;
        border: 0;
        background: transparent;
        color: white;
        resize: none;
        padding: 10px 12px;
        font-size: 14px;
        line-height: 1.6;
      }

      .prompt-input::placeholder { color: #7c849e; }

      .send-button {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        border-radius: 14px;
        padding: 0;
      }

      .send-button svg { width: 18px; height: 18px; }

      .footer {
        padding: 12px 18px 22px;
        text-align: center;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7d869c;
        font-size: 10px;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 88px;
        z-index: 30;
        max-width: min(360px, calc(100vw - 36px));
        padding: 12px 15px;
        border-radius: 12px;
        border: 1px solid rgba(255, 129, 148, 0.28);
        background: rgba(45, 15, 25, 0.96);
        color: #ffeaf0;
        box-shadow: 0 22px 42px rgba(0, 0, 0, 0.22);
        font-size: 12px;
        animation: appear 0.18s ease both;
      }

      .hidden { display: none !important; }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounce {
        0%, 60%, 100% {
          opacity: 0.45;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }

      @media (max-width: 760px) {
        .topbar { min-height: 70px; padding: 10px 16px; }
        .chat-shell { padding: 0 14px; }
        .chat-scroll { padding-top: 22px; }
        .composer-wrap { padding-left: 14px; padding-right: 14px; }
        .composer { width: 100%; }
      }

      @media (max-width: 560px) {
        .topbar { min-height: 64px; padding: 8px 12px; }
        .brand-name { font-size: 1rem; }
        .brand-sub { font-size: 8px; letter-spacing: 0.12em; }
        .status-pill { padding: 7px 9px; font-size: 9px; }
        .auth-controls { gap: 6px; }
        .user-chip { max-width: 150px; padding: 4px 5px 4px 8px; }
        .user-name { max-width: 56px; }
        .signout-btn { min-height: 27px; padding: 0 7px; font-size: 10px; }
        .message-content { max-width: 86%; }
        .message-bubble { padding: 11px 13px; }
        .composer { padding: 7px; border-radius: 14px; }
        .prompt-input { min-height: 38px; padding: 9px; }
        .footer { letter-spacing: 0.12em; font-size: 9px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <header class="topbar">
        <a class="brand" href="/" aria-label="Lumine home">
          <span class="brand-mark">L</span>
          <span class="brand-copy">
            <span class="brand-name">Lumine</span>
            <span class="brand-sub">AI assistant</span>
          </span>
        </a>

        <div class="header-actions">
          <span class="status-pill"><span class="dot"></span>Powered by Gemini 4 Hydrogen</span>

          <div class="auth-controls">
            <button id="login-btn" class="button button-ghost" type="button">
              Sign in with Google
            </button>

            <div id="user-chip" class="user-chip hidden" aria-live="polite">
              <img id="user-avatar" class="user-avatar hidden" alt="" />
              <span id="user-name" class="user-name"></span>
              <button id="logout-btn" class="button button-ghost signout-btn" type="button">
                Sign out
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="chat-shell">
        <section id="chat-scroll" class="chat-scroll" aria-live="polite" aria-label="Chat messages">
          <div id="welcome" class="welcome">
            <div class="welcome-orb" aria-hidden="true">L</div>
            <h2>Hi, I’m <span class="gradient-text">Lumine</span></h2>
            <p>Chat naturally, think clearly, and move faster with your AI assistant.</p>

            <div class="suggestions">
              <button class="suggestion" type="button" data-prompt="Give me a quick summary of a topic.">
                Quick summary
              </button>
              <button class="suggestion" type="button" data-prompt="Help me brainstorm some creative ideas.">
                Brainstorm ideas
              </button>
              <button class="suggestion" type="button" data-prompt="Draft a polished email for my team.">
                Draft email
              </button>
            </div>
          </div>
        </section>
      </main>

      <div class="composer-wrap">
        <form id="chat-form" class="composer">
          <label class="visually-hidden" for="prompt-input">Your message</label>
          <textarea id="prompt-input" class="prompt-input" rows="1" placeholder="Ask Lumine anything..." autocomplete="off" disabled></textarea>
          <button id="send-btn" class="button button-primary send-button" type="submit" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2 11 13" />
              <path d="M22 2 7 22 11 13" />
            </svg>
          </button>
        </form>
        <p id="composer-hint" class="composer-hint">Sign in with Google to start chatting.</p>
      </div>

      <footer class="footer">Made by killer studios</footer>
    </div>

    <script type="module">
      let auth = null;
      let provider = null;
      let currentUser = null;
      let isSending = false;

      const loginBtn = document.getElementById("login-btn");
      const logoutBtn = document.getElementById("logout-btn");
      const userChip = document.getElementById("user-chip");
      const userName = document.getElementById("user-name");
      const userAvatar = document.getElementById("user-avatar");
      const chatScroll = document.getElementById("chat-scroll");
      const chatForm = document.getElementById("chat-form");
      const promptInput = document.getElementById("prompt-input");
      const sendBtn = document.getElementById("send-btn");
      const composerHint = document.getElementById("composer-hint");

      function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      }

      function updateChatAvailability(user) {
        const enabled = Boolean(user) && !isSending;
        promptInput.disabled = !user || isSending;
        sendBtn.disabled = !user || isSending;
        composerHint.textContent = user
          ? "Press Enter to send · Shift + Enter for a new line"
          : "Sign in with Google to start chatting.";
      }

      function setUserUI(user) {
        currentUser = user;
        loginBtn.classList.toggle("hidden", Boolean(user));
        userChip.classList.toggle("hidden", !user);

        if (user) {
          userName.textContent = user.displayName || user.email || "Signed in";
          if (user.photoURL) {
            userAvatar.src = user.photoURL;
            userAvatar.alt = user.displayName || "User avatar";
            userAvatar.classList.remove("hidden");
          } else {
            userAvatar.classList.add("hidden");
            userAvatar.removeAttribute("src");
          }
        } else {
          userName.textContent = "";
          userAvatar.classList.add("hidden");
          userAvatar.removeAttribute("src");
        }

        updateChatAvailability(user);
      }

      function appendMessage(text, role = "assistant", isError = false) {
        const welcome = document.getElementById("welcome");
        if (welcome) welcome.remove();

        const row = document.createElement("article");
        row.className = `message ${role === "user" ? "message-user" : ""} ${isError ? "message-error" : ""}`;

        const avatar = document.createElement("span");
        avatar.className = `message-avatar ${role === "user" ? "user" : ""}`;
        avatar.textContent = role === "user" ? "U" : "L";

        const content = document.createElement("div");
        content.className = "message-content";

        const label = document.createElement("span");
        label.className = "message-label";
        label.textContent = role === "user" ? "You" : "Lumine";

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.textContent = text;

        content.append(label, bubble);
        row.append(avatar, content);
        chatScroll.appendChild(row);
        chatScroll.scrollTop = chatScroll.scrollHeight;
      }

      function addTypingIndicator() {
        const welcome = document.getElementById("welcome");
        if (welcome) welcome.remove();

        const row = document.createElement("div");
        row.className = "message";

        const avatar = document.createElement("span");
        avatar.className = "message-avatar";
        avatar.textContent = "L";

        const bubble = document.createElement("div");
        bubble.className = "message-bubble typing";
        bubble.innerHTML = `
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        `;

        row.append(avatar, bubble);
        chatScroll.appendChild(row);
        chatScroll.scrollTop = chatScroll.scrollHeight;
        return row;
      }

      async function loadFirebaseConfig() {
        const response = await fetch("/.netlify/functions/firebase-config", { cache: "no-store" });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || "Firebase configuration is unavailable.");
        }
        return response.json();
      }

      async function signInWithGoogle() {
        try {
          loginBtn.disabled = true;
          loginBtn.textContent = "Signing in…";
          const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
          const { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");

          const firebaseConfig = await loadFirebaseConfig();
          const app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });

          onAuthStateChanged(auth, (user) => {
            setUserUI(user);
            if (user) {
              currentUser = user;
            }
          });

          await signInWithPopup(auth, provider);
          showToast("Signed in successfully");
        } catch (error) {
          console.error("Google sign-in failed:", error);
          showToast(error.message || "Google sign-in failed. Please try again.");
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign in with Google";
        }
      }

      loginBtn.addEventListener("click", signInWithGoogle);

      logoutBtn.addEventListener("click", async () => {
        try {
          if (!auth) return;
          const { signOut } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
          await signOut(auth);
          showToast("Signed out");
        } catch (error) {
          console.error("Sign-out failed:", error);
          showToast("Sign-out failed");
        }
      });

      async function sendMessage() {
        const prompt = promptInput.value.trim();
        if (!prompt) return;
        if (!currentUser) {
          showToast("Sign in with Google before sending a message.");
          return;
        }

        isSending = true;
        updateChatAvailability(currentUser);

        appendMessage(prompt, "user");
        promptInput.value = "";
        promptInput.style.height = "auto";

        const typingRow = addTypingIndicator();

        try {
          const token = await currentUser.getIdToken(true);
          const response = await fetch("/.netlify/functions/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ prompt })
          });

          const raw = await response.text();
          let data = {};
          try {
            data = raw ? JSON.parse(raw) : {};
          } catch {
            data = {};
          }

          if (!response.ok) {
            throw new Error(data.error || "Unable to contact Lumine.");
          }

          if (!data.reply || !data.reply.trim()) {
            throw new Error("The model returned an empty reply.");
          }

          appendMessage(data.reply.trim(), "assistant");
        } catch (error) {
          console.error("Chat request failed:", error);
          appendMessage(error.message || "Unable to connect to Lumine right now. Please try again.", "assistant", true);
        } finally {
          typingRow.remove();
          isSending = false;
          updateChatAvailability(currentUser);
          promptInput.focus();
        }
      }

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (isSending) return;
        await sendMessage();
      });

      promptInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          chatForm.requestSubmit();
        }
      });

      (async function boot() {
        try {
          const firebaseConfig = await loadFirebaseConfig();
          const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
          const { getAuth, GoogleAuthProvider, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");

          const app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });

          onAuthStateChanged(auth, (user) => {
            setUserUI(user);
          });
        } catch (error) {
          console.error("Firebase setup failed:", error);
          showToast("Authentication is not configured. Check Netlify environment variables.");
          loginBtn.disabled = true;
          composerHint.textContent = "Authentication is not configured. Please check Netlify environment variables.";
        }
      })();
    </script>
  </body>
</html>
