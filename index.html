<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070914" />
    <title>Lumine AI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="./" aria-label="Lumine home">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span class="brand-copy">
            <span class="brand-name">Lumine</span>
            <span class="brand-caption">AI assistant</span>
          </span>
        </a>
        <div class="header-actions">
          <span class="model-badge"><span class="status-dot"></span>Powered by Gemini 4 Hydrogen</span>
          <div class="auth-area">
            <button id="login-btn" class="button button-google" type="button">
              <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.5H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#4A90E2" d="M12.6 27.5a12 12 0 0 1 0-7v-5.3H5.8a20 20 0 0 0 0 17.6l6.8-5.3Z"/><path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.2l6.8 5.3C14.2 15.6 18.7 12 24 12Z"/></svg>
              <span class="button-label">Sign in with Google</span>
            </button>
            <div id="user-pill" class="user-pill hidden" aria-live="polite">
              <img id="user-avatar" class="user-avatar hidden" alt="" />
              <span id="user-name" class="user-name"></span>
              <button id="logout-btn" class="button button-secondary signout-button" type="button">Sign out</button>
            </div>
          </div>
        </div>
      </header>

      <main class="chat-shell">
        <section id="chat-scroll" class="chat-scroll" aria-live="polite" aria-label="Chat messages">
          <div id="welcome" class="welcome">
            <div class="welcome-orb" aria-hidden="true">L</div>
            <h2>Hi, I’m <span class="gradient-text">Lumine</span></h2>
            <p>Chat naturally, think clearly, and move faster with your AI assistant.</p>
            <div class="suggestion-list">
              <button class="suggestion" type="button" data-prompt="Give me a quick summary of a topic.">Quick summary</button>
              <button class="suggestion" type="button" data-prompt="Help me brainstorm some creative ideas.">Brainstorm ideas</button>
              <button class="suggestion" type="button" data-prompt="Draft a polished email for my team.">Draft an email</button>
            </div>
          </div>
        </section>
      </main>

      <div class="composer-wrap">
        <form id="chat-form" class="composer">
          <label class="visually-hidden" for="prompt-input">Your message</label>
          <textarea id="prompt-input" class="prompt-input" rows="1" placeholder="Ask Lumine anything…" autocomplete="off" disabled></textarea>
          <button id="send-btn" class="button button-primary send-button" type="submit" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>
          </button>
        </form>
        <p id="composer-hint" class="composer-hint">Sign in with Google to start chatting.</p>
      </div>
      <footer class="footer">Made by killer studios</footer>
      <div id="toast-region" aria-live="assertive"></div>
    </div>

    <script type="module">
      const $ = (selector) => document.querySelector(selector);
      const loginButton = $("#login-btn");
      const logoutButton = $("#logout-btn");
      const userPill = $("#user-pill");
      const userName = $("#user-name");
      const userAvatar = $("#user-avatar");
      const chatScroll = $("#chat-scroll");
      const welcome = $("#welcome");
      const chatForm = $("#chat-form");
      const promptInput = $("#prompt-input");
      const sendButton = $("#send-btn");
      const composerHint = $("#composer-hint");

      let auth;
      let provider;
      let sending = false;

      function showToast(message) {
        const region = $("#toast-region");
        region.replaceChildren();
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        region.append(toast);
        window.setTimeout(() => toast.remove(), 5000);
      }

      function updateChatAvailability(user) {
        const enabled = Boolean(user) && !sending;
        promptInput.disabled = !user || sending;
        sendButton.disabled = !user || sending;
        composerHint.textContent = user
          ? "Press Enter to send · Shift + Enter for a new line"
          : "Sign in with Google to start chatting.";
      }

      function setAuthUI(user) {
        loginButton.classList.toggle("hidden", Boolean(user));
        userPill.classList.toggle("hidden", !user);
        userName.textContent = user?.displayName || user?.email || "Signed in";
        if (user?.photoURL) {
          userAvatar.src = user.photoURL;
          userAvatar.alt = user.displayName ? `${user.displayName}'s avatar` : "Profile avatar";
          userAvatar.classList.remove("hidden");
        } else {
          userAvatar.removeAttribute("src");
          userAvatar.classList.add("hidden");
        }
        updateChatAvailability(user);
      }

      function appendMessage(text, role = "assistant", isError = false) {
        welcome?.remove();
        const row = document.createElement("article");
        row.className = `message${role === "user" ? " message-user" : ""}${isError ? " message-error" : ""}`;
        const avatar = document.createElement("span");
        avatar.className = `message-avatar${role === "user" ? " message-avatar-user" : ""}`;
        avatar.textContent = role === "user" ? "U" : "L";
        avatar.setAttribute("aria-hidden", "true");
        const content = document.createElement("div");
        content.className = "message-content";
        const label = document.createElement("span");
        label.className = "message-label";
        label.textContent = role === "user" ? "You" : "Lumine";
        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.textContent = text;
        content.append(label, bubble);
        row.append(avatar, content);
        chatScroll.append(row);
        chatScroll.scrollTop = chatScroll.scrollHeight;
        return row;
      }

      function addTypingIndicator() {
        welcome?.remove();
        const row = document.createElement("div");
        row.className = "message";
        row.setAttribute("aria-label", "Lumine is responding");
        const avatar = document.createElement("span");
        avatar.className = "message-avatar";
        avatar.textContent = "L";
        avatar.setAttribute("aria-hidden", "true");
        const content = document.createElement("div");
        content.className = "message-content";
        const bubble = document.createElement("div");
        bubble.className = "message-bubble typing-bubble";
        bubble.innerHTML = "<span></span><span></span><span></span>";
        content.append(bubble);
        row.append(avatar, content);
        chatScroll.append(row);
        chatScroll.scrollTop = chatScroll.scrollHeight;
        return row;
      }

      async function signIn() {
        try {
          loginButton.disabled = true;
          loginButton.querySelector(".button-label").textContent = "Signing in…";
          const { signInWithPopup, signInWithRedirect, getRedirectResult } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
          try {
            await signInWithPopup(auth, provider);
          } catch (error) {
            if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment"].includes(error.code)) {
              await signInWithRedirect(auth, provider);
              return;
            }
            throw error;
          }
        } catch (error) {
          console.error("Google sign-in failed:", error);
          showToast(error.code === "auth/unauthorized-domain"
            ? "This domain is not authorized in Firebase Authentication settings."
            : error.message || "Google sign-in failed. Please try again.");
        } finally {
          loginButton.disabled = false;
          loginButton.querySelector(".button-label").textContent = "Sign in with Google";
        }
      }

      loginButton.addEventListener("click", signIn);
      logoutButton.addEventListener("click", async () => {
        try {
          const { signOut } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
          await signOut(auth);
        } catch (error) {
          console.error("Sign-out failed:", error);
          showToast("Could not sign out. Please try again.");
        }
      });

      document.querySelectorAll(".suggestion").forEach((button) => {
        button.addEventListener("click", () => {
          if (!auth?.currentUser) {
            showToast("Sign in with Google before sending a message.");
            return;
          }
          promptInput.value = button.dataset.prompt || "";
          promptInput.focus();
          promptInput.dispatchEvent(new Event("input"));
        });
      });

      promptInput.addEventListener("input", () => {
        promptInput.style.height = "auto";
        promptInput.style.height = `${Math.min(promptInput.scrollHeight, 150)}px`;
      });

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (sending) return;
        const prompt = promptInput.value.trim();
        if (!prompt) return;
        if (!auth?.currentUser) {
          showToast("Sign in with Google before sending a message.");
          return;
        }

        sending = true;
        updateChatAvailability(auth.currentUser);
        appendMessage(prompt, "user");
        promptInput.value = "";
        promptInput.style.height = "auto";
        const typing = addTypingIndicator();

        try {
          const token = await auth.currentUser.getIdToken();
          const response = await fetch("/.netlify/functions/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ prompt })
          });
          const body = await response.text();
          let data;
          try {
            data = body ? JSON.parse(body) : {};
          } catch {
            throw new Error(`The chat function returned an invalid response (HTTP ${response.status}).`);
          }
          if (!response.ok) {
            throw new Error(data.error || `Chat request failed (HTTP ${response.status}).`);
          }
          if (typeof data.reply !== "string" || !data.reply.trim()) {
            throw new Error("The model returned an empty reply. Please try again.");
          }
          appendMessage(data.reply.trim());
        } catch (error) {
          console.error("Chat request failed:", error);
          appendMessage(error.message || "Unable to connect to Lumine. Please try again.", "assistant", true);
        } finally {
          typing.remove();
          sending = false;
          updateChatAvailability(auth.currentUser);
          if (auth.currentUser) promptInput.focus();
        }
      });

      promptInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          chatForm.requestSubmit();
        }
      });

      try {
        const configResponse = await fetch("/.netlify/functions/firebase-config", { cache: "no-store" });
        const config = await configResponse.json();
        if (!configResponse.ok) throw new Error(config.error || "Firebase configuration is unavailable.");
        const [{ initializeApp }, firebaseAuth] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js")
        ]);
        const app = initializeApp(config);
        auth = firebaseAuth.getAuth(app);
        provider = new firebaseAuth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        firebaseAuth.onAuthStateChanged(auth, setAuthUI);
        firebaseAuth.getRedirectResult(auth).catch((error) => {
          console.error("Google redirect sign-in failed:", error);
          showToast(error.message || "Google sign-in failed.");
        });
      } catch (error) {
        console.error("Firebase initialization failed:", error);
        loginButton.disabled = true;
        showToast("Authentication setup is incomplete. Check the Firebase environment variables in Netlify.");
        composerHint.textContent = "Authentication is not configured. Please contact the site administrator.";
      }
    </script>
  </body>
</html>
