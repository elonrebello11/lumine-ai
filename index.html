<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumine AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
        --page: #070b16;
        --bg-1: #090d1b;
        --bg-2: #0d1222;
        --panel: rgba(15, 22, 37, 0.7);
        --panel-strong: rgba(16, 24, 41, 0.94);
        --line: rgba(180, 191, 255, 0.15);
        --line-bright: rgba(180, 191, 255, 0.28);
        --text: #edf0ff;
        --muted: #a8afcb;
        --soft: #7d84a1;
        --primary: #8a7cff;
        --primary-strong: #6f5fe8;
        --cyan: #68d5f5;
        --success: #72e5b9;
        --danger: #ff8398;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--page);
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 12%, rgba(112, 96, 255, 0.18), transparent 25%),
          radial-gradient(circle at 88% 84%, rgba(75, 202, 255, 0.12), transparent 20%),
          linear-gradient(135deg, #070b16 0%, #09101d 45%, #0a101d 100%);
        font-family: "Inter", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body, button, input, textarea {
        font-family: "Inter", "Segoe UI", sans-serif;
      }

      button, input, textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid rgba(138, 124, 255, 0.8);
        outline-offset: 2px;
      }

      ::selection {
        background: rgba(138, 124, 255, 0.35);
        color: #fff;
      }

      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        isolation: isolate;
      }

      .ambient {
        position: absolute;
        width: 460px;
        height: 460px;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.14;
        pointer-events: none;
        z-index: 0;
      }

      .ambient.one {
        left: -180px;
        top: 8%;
        background: #7c6cff;
      }

      .ambient.two {
        right: -180px;
        bottom: 8%;
        background: #56d4f8;
      }

      .glass {
        border: 1px solid var(--line);
        background: rgba(14, 20, 31, 0.72);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .topbar {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 80px;
        padding: 14px clamp(16px, 4vw, 40px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        background: rgba(8, 11, 19, 0.66);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--text);
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 16px;
        background: linear-gradient(145deg, #9a8dff, #665ae7 70%);
        box-shadow: 0 10px 28px rgba(124, 108, 255, 0.35);
        border: 1px solid rgba(222, 216, 255, 0.35);
        font-weight: 800;
        font-size: 20px;
        color: white;
      }

      .brand-copy {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }

      .brand-name {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .brand-sub {
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--soft);
      }

      .header-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(132, 122, 255, 0.28);
        background: rgba(83, 69, 157, 0.18);
        color: #dfe1ff;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .status-pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 10px rgba(114, 229, 185, 0.8);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 13px;
        border: none;
        background: transparent;
        color: currentColor;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      }

      .button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .button:active:not(:disabled) {
        transform: translateY(0) scale(0.98);
      }

      .button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .button-primary {
        background: linear-gradient(135deg, #8f82ff, #685ce6);
        box-shadow: 0 10px 24px rgba(101, 88, 220, 0.24);
        color: white;
      }

      .button-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #9b90ff, #7268eb);
      }

      .button-ghost {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: #edf4ff;
      }

      .button-ghost:hover:not(:disabled) {
        border-color: var(--line-bright);
        background: rgba(255, 255, 255, 0.08);
      }

      .icon {
        width: 18px;
        height: 18px;
      }

      .auth-controls {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }

      .user-chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 5px 7px 5px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.035);
        max-width: 240px;
      }

      .user-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.08);
      }

      .user-name {
        overflow: hidden;
        max-width: 120px;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 12px;
        color: #eff3ff;
      }

      .signout-btn {
        min-height: 30px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 11px;
      }

      .chat-shell {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        width: min(100%, 920px);
        min-height: 0;
        flex: 1;
        align-self: center;
        padding: 0 clamp(14px, 3vw, 32px);
      }

      .chat-scroll {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-height: 0;
        flex: 1;
        overflow-y: auto;
        padding: 28px 2px 32px;
        scrollbar-width: thin;
        scrollbar-color: rgba(138, 124, 255, 0.38) transparent;
      }

      .chat-scroll::-webkit-scrollbar {
        width: 6px;
      }

      .chat-scroll::-webkit-scrollbar-track {
        background: transparent;
      }

      .chat-scroll::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(138, 124, 255, 0.38);
      }

      .welcome {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        align-self: center;
        margin: auto 0;
        padding: 24px 12px 32px;
        max-width: 650px;
      }

      .welcome-orb {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(146, 132, 255, 0.96), rgba(82, 86, 171, 0.96));
        border: 1px solid rgba(204, 195, 255, 0.42);
        box-shadow: 0 12px 34px rgba(107, 96, 224, 0.34);
        color: white;
        font-size: 34px;
        font-weight: 700;
        margin-bottom: 18px;
      }

      .welcome h2 {
        margin: 0;
        font-size: clamp(32px, 4.5vw, 52px);
        line-height: 1.05;
        letter-spacing: -0.06em;
        font-weight: 700;
      }

      .gradient-text {
        background: linear-gradient(135deg, #d2ceff 0%, #8eddf6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .welcome p {
        margin: 12px 0 0;
        max-width: 470px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.75;
      }

      .suggestions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 22px;
      }

      .suggestion {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
        color: #dfe5ff;
        font-size: 11px;
        cursor: pointer;
        transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
      }

      .suggestion:hover {
        border-color: var(--line-bright);
        background: rgba(138, 124, 255, 0.1);
        transform: translateY(-1px);
      }

      .message {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        width: 100%;
        animation: appear 0.25s ease both;
      }

      .message-user {
        justify-content: flex-end;
      }

      .message-avatar {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border-radius: 12px;
        background: linear-gradient(145deg, #8a7cff, #5d53d8);
        border: 1px solid rgba(214, 208, 255, 0.22);
        font-weight: 700;
        color: white;
        font-size: 14px;
      }

      .message-avatar.user {
        background: linear-gradient(145deg, #43a8d6, #2c6f8a);
        border-color: rgba(122, 211, 249, 0.24);
      }

      .message-content {
        display: flex;
        flex-direction: column;
        max-width: min(80%, 700px);
        gap: 6px;
      }

      .message-user .message-content {
        align-items: flex-end;
      }

      .message-bubble {
        overflow-wrap: anywhere;
        padding: 13px 16px;
        border-radius: 18px 18px 18px 6px;
        border: 1px solid var(--line);
        background: rgba(18, 25, 39, 0.8);
        color: #edf0ff;
        box-shadow: 0 9px 24px rgba(0, 0, 0, 0.08);
        line-height: 1.72;
      }

      .message-user .message-bubble {
        border-radius: 18px 18px 6px 18px;
        background: linear-gradient(140deg, rgba(111, 94, 228, 0.95), rgba(82, 72, 180, 0.92));
        border-color: rgba(150, 143, 255, 0.22);
      }

      .message-error .message-bubble {
        border: 1px solid rgba(255, 129, 148, 0.22);
        background: rgba(81, 25, 37, 0.4);
        color: #ffd8df;
      }

      .message-bubble p {
        margin: 0 0 10px;
      }

      .message-bubble p:last-child {
        margin-bottom: 0;
      }

      .message-bubble pre,
      .message-bubble code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .message-bubble pre {
        margin: 12px 0;
        padding: 12px 13px;
        border-radius: 10px;
        background: rgba(5, 9, 18, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.07);
      }

      .typing {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .typing-dot {
        width: 7px;
        height: 7px;
        display: inline-block;
        border-radius: 50%;
        background: rgba(170, 161, 255, 0.9);
        animation: bounce 1s infinite ease-in-out;
      }

      .typing-dot:nth-child(2) {
        animation-delay: 0.15s;
      }

      .typing-dot:nth-child(3) {
        animation-delay: 0.25s;
      }

      .composer-wrap {
        position: relative;
        z-index: 2;
        padding: 10px clamp(14px, 3vw, 32px) 14px;
        background: linear-gradient(180deg, rgba(7, 11, 22, 0), rgba(8, 11, 20, 0.8) 16%);
      }

      .composer {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        width: min(100%, 885px);
        margin: 0 auto;
        padding: 10px;
        border-radius: 18px;
        background: rgba(18, 22, 35, 0.9);
        border: 1px solid rgba(171, 183, 255, 0.18);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .composer:focus-within {
        border-color: rgba(138, 124, 255, 0.5);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.2), 0 0 0 3px rgba(138, 124, 255, 0.08);
      }

      .prompt-input {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        max-height: 170px;
        border: 0;
        background: transparent;
        color: white;
        resize: none;
        padding: 10px 12px;
        font-size: 14px;
        line-height: 1.6;
      }

      .prompt-input::placeholder {
        color: #7c849e;
      }

      .send-button {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        border-radius: 14px;
        padding: 0;
      }

      .send-button svg {
        width: 18px;
        height: 18px;
      }

      .footer {
        padding: 12px 18px 22px;
        text-align: center;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7d869c;
        font-size: 10px;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 88px;
        z-index: 30;
        max-width: min(360px, calc(100vw - 36px));
        padding: 12px 15px;
        border-radius: 12px;
        border: 1px solid rgba(255, 129, 148, 0.28);
        background: rgba(45, 15, 25, 0.96);
        color: #ffeaf0;
        box-shadow: 0 22px 42px rgba(0, 0, 0, 0.22);
        font-size: 12px;
        animation: appear 0.18s ease both;
      }

      .hidden {
        display: none !important;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounce {
        0%, 60%, 100% {
          opacity: 0.45;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }

      @media (max-width: 760px) {
        .topbar {
          min-height: 70px;
          padding: 10px 16px;
        }

        .chat-shell {
          padding: 0 14px;
        }

        .chat-scroll {
          padding-top: 22px;
        }

        .composer-wrap {
          padding-left: 14px;
          padding-right: 14px;
        }

        .composer {
          width: 100%;
        }
      }

      @media (max-width: 560px) {
        .topbar {
          min-height: 64px;
          padding: 8px 12px;
        }

        .brand-name {
          font-size: 1rem;
        }

        .brand-sub {
          font-size: 8px;
          letter-spacing: 0.12em;
        }

        .status-pill {
          padding: 7px 9px;
          font-size: 9px;
        }

        .auth-controls {
          gap: 6px;
        }

        .user-chip {
          max-width: 150px;
          padding: 4px 5px 4px 8px;
        }

        .user-name {
          max-width: 56px;
        }

        .signout-btn {
          min-height: 27px;
          padding: 0 7px;
          font-size: 10px;
        }

        .message-content {
          max-width: 86%;
        }

        .message-bubble {
          padding: 11px 13px;
        }

        .composer {
          padding: 7px;
          border-radius: 14px;
        }

        .prompt-input {
          min-height: 38px;
          padding: 9px;
        }

        .footer {
          letter-spacing: 0.12em;
          font-size: 9px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="ambient one"></div>
      <div class="ambient two"></div>

      <header class="topbar">
        <div class="brand" aria-label="Lumine home">
          <div class="brand-mark">L</div>
          <div class="brand-copy">
            <div class="brand-name">Lumine</div>
            <div class="brand-sub">AI assistant</div>
          </div>
        </div>

        <div class="header-actions">
          <div class="status-pill">
            <span class="dot"></span>
            Powered by Gemini 4 Hydrogen
          </div>

          <div class="auth-controls">
            <button id="login-btn" type="button" class="button button-ghost">
              Sign in with Google
            </button>

            <div id="user-chip" class="user-chip hidden" aria-live="polite">
              <img id="user-avatar" class="user-avatar" alt="" />
              <span id="user-name" class="user-name"></span>
              <button id="logout-btn" type="button" class="button button-ghost signout-btn">
                Sign out
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="chat-shell">
        <div id="chat-scroll" class="chat-scroll">
          <div class="welcome">
            <div class="welcome-orb">L</div>
            <h2>Hi, I’m <span class="gradient-text">Lumine</span></h2>
            <p>
              Chat naturally, think clearly, and move faster with a clean AI workspace built for focused work.
            </p>
            <div class="suggestions">
              <button type="button" class="suggestion" data-prompt="Give me a quick summary of my project.">
                Quick summary
              </button>
              <button type="button" class="suggestion" data-prompt="Plan a 5-step growth strategy for my startup.">
                Growth strategy
              </button>
              <button type="button" class="suggestion" data-prompt="Draft a polished email for my team.">
                Draft email
              </button>
            </div>
          </div>
        </div>
      </main>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="prompt-input" class="prompt-input" rows="1" placeholder="Ask Lumine anything..."></textarea>
          <button id="send-btn" class="button button-primary send-button" type="submit" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3.75l18 6.75-18 6.75L7 9.5l-16-6.75Z" />
            </svg>
          </button>
        </div>
        <div class="composer-hint" aria-hidden="true">
          <span>Ready when you are</span>
        </div>
      </div>

      <div class="footer">Made by killer studios</div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
  apiKey: "AIzaSyBB0rtme8j8C7ykkdbf0MoQkx_hmkoMyIc",
  authDomain: "lumine-ai-dde1b.firebaseapp.com",
  projectId: "lumine-ai-dde1b",
  storageBucket: "lumine-ai-dde1b.firebasestorage.app",
  messagingSenderId: "33838856101",
  appId: "1:33838856101:web:49bc34befba81df7b71a4c"
};


      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({
        prompt: "select_account"
      });

      let idToken = null;

      const loginBtn = document.getElementById("login-btn");
      const userChip = document.getElementById("user-chip");
      const userName = document.getElementById("user-name");
      const userAvatar = document.getElementById("user-avatar");
      const chatScroll = document.getElementById("chat-scroll");
      const promptInput = document.getElementById("prompt-input");
      const sendBtn = document.getElementById("send-btn");

      function showToast(message) {
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();

        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
          toast.remove();
        }, 2600);
      }

      function appendMessage(text, role = "assistant") {
        const message = document.createElement("div");
        message.className = `message ${role === "user" ? "message-user" : ""}`;

        const avatar = document.createElement("div");
        avatar.className = `message-avatar ${role === "user" ? "user" : ""}`;
        avatar.textContent = role === "user" ? "U" : "L";

        const bubble = document.createElement("div");
        bubble.className = `message-bubble ${role === "user" ? "" : ""}`;

        const textNode = document.createElement("div");
        textNode.innerHTML = escapeHtml(text);

        bubble.appendChild(textNode);
        message.appendChild(avatar);
        message.appendChild(bubble);
        chatScroll.appendChild(message);
        chatScroll.scrollTop = chatScroll.scrollHeight;
      }

      function appendError(text) {
        const message = document.createElement("div");
        message.className = "message message-error";
        const avatar = document.createElement("div");
        avatar.className = "message-avatar";
        avatar.textContent = "L";

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.innerHTML =
          '<div>' + escapeHtml(text) + '</div>';

        message.appendChild(avatar);
        message.appendChild(bubble);
        chatScroll.appendChild(message);
        chatScroll.scrollTop = chatScroll.scrollHeight;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function setUserState(user) {
        if (user) {
          loginBtn.classList.add("hidden");
          userChip.classList.remove("hidden");

          const name = user.displayName || user.email || "User";
          userName.textContent = name;
          userAvatar.src = user.photoURL || "";
          userAvatar.alt = user.displayName || "User avatar";
          idToken = user.getIdToken ? user.getIdToken() : null;

          if (user.photoURL) {
            userAvatar.style.display = "block";
          } else {
            userAvatar.style.display = "none";
          }
        } else {
          loginBtn.classList.remove("hidden");
          userChip.classList.add("hidden");
          userName.textContent = "";
          userAvatar.src = "";
          userAvatar.alt = "";
          idToken = null;
        }
      }

      async function refreshIdToken() {
        if (!auth.currentUser) return null;
        try {
          const token = await auth.currentUser.getIdToken(true);
          idToken = token;
          return token;
        } catch (error) {
          console.error("Token refresh failed:", error);
          return null;
        }
      }

      loginBtn.addEventListener("click", async () => {
        try {
          loginBtn.disabled = true;
          loginBtn.textContent = "Signing in...";
          await signInWithPopup(auth, provider);
          showToast("Signed in successfully");
        } catch (error) {
          console.error("Google sign-in failed:", error);
          showToast("Sign-in failed. Please try again.");
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign in with Google";
        }
      });

      logoutBtn.addEventListener("click", async () => {
        try {
          await signOut(auth);
          showToast("Signed out");
        } catch (error) {
          console.error("Sign-out failed:", error);
          showToast("Sign-out failed");
        }
      });

      onAuthStateChanged(auth, async (user) => {
        setUserState(user);

        if (user) {
          await refreshIdToken();
        }
      });

      function addQuickPrompt(prompt) {
        const input = promptInput;
        input.value = prompt;
        input.focus();
      }

      document.querySelectorAll(".suggestion").forEach((button) => {
        button.addEventListener("click", () => {
          addQuickPrompt(button.dataset.prompt);
        });
      });

      async function sendMessage() {
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        promptInput.value = "";
        promptInput.focus();

        appendMessage(prompt, "user");

        const loadingId = "loading-" + Date.now();
        const loading = document.createElement("div");
        loading.className = "message";
        loading.innerHTML = `
          <div class="message-avatar">L</div>
          <div class="message-bubble">
            <div class="typing">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>
        `;
        chatScroll.appendChild(loading);
        chatScroll.scrollTop = chatScroll.scrollHeight;

        try {
          const token = await refreshIdToken();

          const headers = {
            "Content-Type": "application/json"
          };

          if (token) {
            headers.Authorization = `Bearer ${token}`;
          }

          const response = await fetch("/.netlify/functions/chat", {
            method: "POST",
            headers,
            body: JSON.stringify({ prompt })
          });

          const text = await response.text();
          let data = {};
          try {
            data = text ? JSON.parse(text) : {};
          } catch (error) {
            data = {};
          }

          if (!response.ok) {
            const errorMessage =
              data?.error ||
              "Something went wrong while contacting Lumine.";

            loading.remove();
            appendError(errorMessage);
            return;
          }

          loading.remove();

          if (data.reply) {
            appendMessage(data.reply, "assistant");
          } else {
            appendError("Lumine did not return a message.");
          }
        } catch (error) {
          console.error("Chat request failed:", error);
          loading.remove();
          appendError("Unable to connect to Lumine right now. Please try again.");
        }
      }

      sendBtn.addEventListener("click", sendMessage);

      promptInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });
    </script>
  </body>
</html>
