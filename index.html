<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumine AI — Advanced Autonomous Neural Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lumine: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                            950: '#03050a',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. ROOT VARIABLES & CORE THEME SYSTEM
           ========================================================================== */
        :root {
            --bg-base: #03050a;
            --bg-surface: rgba(10, 14, 26, 0.85);
            --border-primary: rgba(99, 102, 241, 0.18);
            --border-glow: rgba(99, 102, 241, 0.45);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-glow: rgba(79, 70, 229, 0.25);
        }

        /* ==========================================================================
           2. GLOBAL RESETS & TYPOGRAPHY
           ========================================================================== */
        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: rgba(99, 102, 241, 0.3) transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        code, pre, .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* ==========================================================================
           3. ADVANCED KEYFRAME ANIMATION ENGINE (3300+ Line Styling Architecture)
           ========================================================================== */
        @keyframes floatOrb1 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(40px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.95); }
        }

        @keyframes floatOrb2 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(-50px, 40px) scale(1.05); }
            66% { transform: translate(30px, -40px) scale(0.9); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.35; filter: blur(40px); }
            50% { opacity: 0.75; filter: blur(60px); }
        }

        @keyframes shimmerWave {
            0% { background-position: -400% 0; }
            100% { background-position: 400% 0; }
        }

        @keyframes messageSlideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes borderPulse {
            0%, 100% { border-color: rgba(99, 102, 241, 0.2); }
            50% { border-color: rgba(99, 102, 241, 0.6); }
        }

        @keyframes bounceWave {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .animate-message-in {
            animation: messageSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ==========================================================================
           4. BACKGROUND PATTERNS & AMBIENT GLOW SYSTEM
           ========================================================================== */
        .bg-neural-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(99, 102, 241, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(99, 102, 241, 0.035) 1px, transparent 1px);
        }

        .ambient-orb-1 {
            position: absolute;
            top: -150px;
            left: -150px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.18) 0%, rgba(3, 5, 10, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb1 14s ease-in-out infinite, pulseGlow 8s ease-in-out infinite;
        }

        .ambient-orb-2 {
            position: absolute;
            bottom: -150px;
            right: -150px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.12) 0%, rgba(3, 5, 10, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb2 18s ease-in-out infinite, pulseGlow 10s ease-in-out infinite;
        }

        /* ==========================================================================
           5. ADVANCED GLASSMORPHISM & UI COMPONENT STYLING
           ========================================================================== */
        .glass-panel {
            background: var(--bg-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-primary);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        .glass-input-wrapper {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input-wrapper:focus-within {
            background: rgba(15, 23, 42, 0.95);
            border-color: rgba(99, 102, 241, 0.7);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18), 0 0 25px rgba(99, 102, 241, 0.15);
        }

        .interactive-element {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .interactive-element:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.4);
        }
        .interactive-element:active {
            transform: translateY(1px);
        }

        /* Custom Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.25);
            border-radius: 9999px;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: background 0.3s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        /* Neural Typing Indicator Animation */
        .typing-dot {
            width: 7px;
            height: 7px;
            background-color: #818cf8;
            border-radius: 50%;
            display: inline-block;
            animation: bounceWave 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="flex flex-col justify-between bg-neural-grid relative">

    <!-- Ambient Glow Orbs -->
    <div class="ambient-orb-1"></div>
    <div class="ambient-orb-2"></div>

    <!-- Top Corner Branding Badge -->
    <div class="absolute top-4 right-6 z-30 hidden md:flex items-center space-x-2.5 text-[11px] font-semibold text-indigo-300 bg-indigo-950/80 px-4 py-1.5 rounded-full border border-indigo-500/35 shadow-2xl backdrop-blur-md">
        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>
        <span class="tracking-wide">Powered by Hydrogen Gemini</span>
    </div>

    <!-- Main Navigation Header -->
    <header class="border-b border-slate-800/80 glass-panel px-4 sm:px-8 py-3.5 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-4">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex items-center justify-center font-bold text-lg text-white shadow-xl shadow-indigo-600/30 ring-1 ring-white/20">
                L
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight text-white flex items-center gap-2.5">
                    Lumine 
                    <span class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-0.5 rounded-full font-semibold uppercase tracking-wider">v3.0 Ultra</span>
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">Advanced autonomous neural architecture</p>
            </div>
        </div>

        <!-- Authentication & Control Toolbar -->
        <div id="auth-section" class="flex items-center space-x-3">
            <button id="login-btn" onclick="loginWithGoogle()" class="interactive-element bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold shadow-lg shadow-indigo-600/35 flex items-center gap-2.5">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12.24 10.285V14.2h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0 5.48 0 0 5.48 0 12.24s5.48 12.24 12.24 12.24c7.058 0 11.732-4.96 11.732-11.951 0-.825-.088-1.452-.196-2.044H12.24z"/></svg>
                <span>Sign in with Google</span>
            </button>
            <div id="user-info" class="hidden items-center space-x-3.5 bg-slate-900/90 border border-slate-800 px-4.5 py-2 rounded-xl shadow-inner">
                <span id="user-name" class="text-xs sm:text-sm font-medium text-slate-200 max-w-[140px] sm:max-w-[200px] truncate"></span>
                <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/30 border border-slate-700/80 px-2.5 py-1 rounded-lg text-slate-400 transition-all">Sign out</button>
            </div>
        </div>
    </header>

    <!-- Chat Message Container -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-8 space-y-6 max-w-4xl w-full mx-auto z-10" id="chat-container">
        <!-- Welcome Hero Greeting -->
        <div class="flex items-start space-x-4 animate-message-in">
            <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center font-bold text-sm text-white shadow-xl shadow-indigo-600/30 shrink-0 ring-1 ring-white/20">L</div>
            <div class="space-y-4 max-w-[92%] sm:max-w-[85%]">
                <div class="glass-panel rounded-2xl p-5 sm:p-6 text-sm sm:text-base text-slate-200 shadow-2xl leading-relaxed border-slate-800/80">
                    <h2 class="font-bold text-white text-base mb-1.5 flex items-center gap-2.5">
                        <span>System Online. I am Lumine.</span>
                        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    </h2>
                    <p class="text-slate-300">Neural network active and fully synchronized. Select a prompt preset below or issue your query directly.</p>
                </div>
                <!-- Interactive Suggestion Chips -->
                <div class="flex flex-wrap gap-2.5 pt-1">
                    <button onclick="sendPreset('Execute comprehensive neural diagnostics')" class="interactive-element text-xs bg-slate-900/90 hover:bg-indigo-600/20 hover:border-indigo-500/50 border border-slate-800 text-slate-300 px-3.5 py-2 rounded-xl shadow-sm flex items-center gap-1.5">⚡ Run neural diagnostics</button>
                    <button onclick="sendPreset('Draft an advanced async microservice architecture')" class="interactive-element text-xs bg-slate-900/90 hover:bg-indigo-600/20 hover:border-indigo-500/50 border border-slate-800 text-slate-300 px-3.5 py-2 rounded-xl shadow-sm flex items-center gap-1.5">💻 Async microservices blueprint</button>
                    <button onclick="sendPreset('Analyze distributed cache invalidation patterns')" class="interactive-element text-xs bg-slate-900/90 hover:bg-indigo-600/20 hover:border-indigo-500/50 border border-slate-800 text-slate-300 px-3.5 py-2 rounded-xl shadow-sm flex items-center gap-1.5">🗄️ Cache invalidation patterns</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Input Dock & Sticky Footer -->
    <footer class="border-t border-slate-800/80 glass-panel p-4 sm:p-6 z-20 shrink-0">
        <form id="chat-form" onsubmit="handleSubmit(event)" class="max-w-4xl mx-auto flex gap-3 items-center">
            <div class="relative flex-1 glass-input-wrapper rounded-2xl overflow-hidden">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Ask Lumine or execute /admin commands..." 
                    autocomplete="off"
                    class="w-full bg-transparent px-5 py-4 text-sm sm:text-base text-slate-100 placeholder-slate-500 outline-none"
                >
            </div>
            <button 
                type="submit" 
                id="send-btn"
                class="interactive-element bg-indigo-600 hover:bg-indigo-500 text-white px-6.5 py-4 rounded-2xl text-sm font-semibold shadow-lg shadow-indigo-600/35 shrink-0 flex items-center justify-center gap-2.5"
            >
                <span>Send</span>
                <svg class="w-4 h-4 rotate-90" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </form>

        <!-- Fixed Killer Studious Branding Footer -->
        <div class="text-center mt-3.5 pt-2.5 border-t border-slate-900/80 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-6 text-[11px] text-slate-500 font-medium tracking-wide">
            <span class="uppercase font-semibold text-slate-400">Made by killer studious</span>
            <span class="hidden sm:inline text-slate-700">•</span>
            <span class="text-indigo-400 font-semibold md:hidden">Powered by Hydrogen Gemini</span>
        </div>
    </footer>

    <!-- Firebase SDK & Application Runtime Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBB0rtme8j8C7ykkdbf0MoQkx_hmkoMyIc",
            authDomain: "lumine-ai-dde1b.firebaseapp.com",
            projectId: "lumine-ai-dde1b",
            storageBucket: "lumine-ai-dde1b.firebasestorage.app",
            messagingSenderId: "33838856101",
            appId: "1:33838856101:web:49bc34befba81df7b71a4c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let idToken = null;

        window.loginWithGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Firebase authentication popup error:", error);
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            const loginBtn = document.getElementById('login-btn');
            const userInfo = document.getElementById('user-info');
            const userName = document.getElementById('user-name');

            if (user) {
                loginBtn.classList.add('hidden');
                userInfo.style.display = 'flex';
                userName.textContent = user.displayName || user.email;
                idToken = await user.getIdToken();
            } else {
                loginBtn.classList.remove('hidden');
                userInfo.style.display = 'none';
                idToken = null;
            }
        });

        window.sendPreset = (text) => {
            document.getElementById('user-input').value = text;
            document.getElementById('chat-form').dispatchEvent(new Event('submit'));
        };

        window.handleSubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const prompt = input.value.trim();
            if (!prompt) return;

            const container = document.getElementById('chat-container');
            
            // Append User Message Bubble
            container.innerHTML += `
                <div class="flex items-end justify-end space-x-3 animate-message-in">
                    <div class="bg-indigo-600 text-white rounded-2xl px-5 py-3.5 text-sm sm:text-base max-w-[85%] shadow-lg leading-relaxed font-medium">${escapeHtml(prompt)}</div>
                </div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Append Neural Processing Loading Bubble
            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `
                <div id="${loadingId}" class="flex items-start space-x-4 animate-message-in">
                    <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center font-bold text-sm text-white shadow-xl shrink-0 ring-1 ring-white/20">L</div>
                    <div class="glass-panel rounded-2xl px-5 py-4 text-sm text-slate-300 shadow-2xl flex items-center gap-3 border-slate-800">
                        <div class="flex space-x-1.5 items-center">
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </div>
                        <span class="text-xs font-semibold text-slate-400 tracking-wide">Lumine neural core processing...</span>
                    </div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (idToken) headers['Authorization'] = `Bearer ${idToken}`;

                const res = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();

                document.getElementById(loadingId).remove();
                
                container.innerHTML += `
                    <div class="flex items-start space-x-4 animate-message-in">
                        <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center font-bold text-sm text-white shadow-xl shrink-0 ring-1 ring-white/20">L</div>
                        <div class="glass-panel rounded-2xl px-5 py-4 text-sm sm:text-base text-slate-200 shadow-2xl max-w-[90%] sm:max-w-[85%] leading-relaxed border-slate-800">${escapeHtml(data.reply || data.error)}</div>
                    </div>`;
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `
                    <div class="flex items-start space-x-4 animate-message-in">
                        <div class="w-10 h-10 rounded-2xl bg-red-600 flex items-center justify-center font-bold text-sm text-white shadow-xl shrink-0">!</div>
                        <div class="glass-panel rounded-2xl px-5 py-4 text-sm text-red-400 shadow-2xl max-w-[85%] border-red-900/50">Connection fault detected. Please inspect network or Netlify function deployment logs.</div>
                    </div>`;
                container.scrollTop = container.scrollHeight;
            }
        };

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
